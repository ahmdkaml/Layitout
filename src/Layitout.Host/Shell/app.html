<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layitout Studio</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="layitout-app">
    <!-- Top Header -->
    <header class="app-header">
      <div class="logo">Layitout <span class="badge">Event Studio</span></div>
      <div class="header-status">Event Binding Mode: Visual / Declarative</div>
    </header>

    <!-- Main Studio Split View -->
    <main class="app-body">
      <!-- Left: Workspace & Event Management Panels -->
      <aside class="workspace-panel" id="workspacePanel">
        <div class="workspace-tabs">
          <button class="tab-btn active" data-tab="binding">Event Wiring</button>
          <button class="tab-btn" data-tab="graph">Flow Map</button>
        </div>

        <!-- Tab 1: Component Inspector & Event Configuration -->
        <div class="tab-content" id="tabBinding">
          <!-- Discovered Components Picker -->
          <section class="config-section">
            <div class="section-title-row">
              <h3>Discovered Components</h3>
              <button id="btnScanDom" class="btn-xs">Rescan UI</button>
            </div>
            <p class="section-hint">Select a component to inspect or attach events/listeners:</p>
            <div id="componentList" class="component-pill-list">
              <!-- Dynamically populated -->
            </div>
          </section>

          <!-- Active Element Binding Card -->
          <section class="config-section" id="bindingSection">
            <h3 id="selectedTargetHeader">Active: #btn-generate-puzzle</h3>

            <!-- Emitters Form -->
            <div class="binding-group">
              <label class="group-title">⚡ Emitter (Dispatches to Channel)</label>
              <div class="form-row">
                <input type="text" id="emitterInput" class="form-input" placeholder="e.g. event_generate_puzzle" />
                <button id="btnSaveEmitter" class="btn-action">Attach Emitter</button>
              </div>
              <div class="current-binding" id="activeEmitterDisplay">Emitter: <em>None</em></div>
            </div>

            <!-- Listeners Form -->
            <div class="binding-group">
              <label class="group-title">👂 Listener (Subscribes to Channel)</label>
              <div class="form-row">
                <input type="text" id="listenerInput" class="form-input" placeholder="e.g. puzzle_generated" />
                <button id="btnSaveListener" class="btn-action">Attach Listener</button>
              </div>
              <div class="current-binding" id="activeListenerDisplay">Listener: <em>None</em></div>
            </div>
          </section>
        </div>

        <!-- Tab 2: Visual Event Relationship Flow -->
        <div class="tab-content hidden" id="tabGraph">
          <section class="config-section">
            <h3>Event Relationship Graph</h3>
            <p class="section-hint">Active UI-to-Channel relationship matrix:</p>
            <div id="relationshipFlow" class="flow-container">
              <!-- Dynamically rendered visual cards -->
            </div>
          </section>
        </div>
      </aside>

      <!-- Resizable Splitter Handle -->
      <div class="resizer" id="dragResizer"></div>

      <!-- Right: Sandboxed HTML/CSS Preview Canvas -->
      <section class="preview-panel" id="previewPanel">
        <div class="preview-toolbar">
          <span class="preview-title">Sandboxed UI Canvas</span>
          <div class="preview-actions">
            <button id="btnReloadPreview" class="btn-sm">Reload Canvas</button>
          </div>
        </div>
        <div class="preview-viewport">
          <iframe id="previewFrame" title="User Application Preview" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
