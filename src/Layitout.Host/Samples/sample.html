<main class="app-container">
  <!-- Button emits 'request_color' action on click -->
  <button
    id="btn-color-box"
    class="layitout-btn"
    data-emit="request_color">
    Color Box
  </button>

  <!-- Box listens for mutations on channel 'box_color' -->
  <div
    id="box-target"
    class="layitout-box"
    data-listen="box_color">
    <span class="box-text">Default Box</span>
  </div>
</main>
